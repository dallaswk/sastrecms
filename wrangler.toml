# Workers config, not Pages. @astrojs/cloudflare v14 builds a Worker with an ASSETS
# binding for the static output, and the name ASSETS is reserved in Pages projects — so
# `pages_build_output_dir` here made wrangler refuse the generated config outright.
# The adapter fills in `main` and `assets` when it writes dist/server/wrangler.json.
name = "sastrecms"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Add non-secret vars here

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sastrecms-media"

# Secrets (set via wrangler secret put):
# TURSO_DATABASE_URL
# TURSO_AUTH_TOKEN
# R2_PUBLIC_URL
# BETTER_AUTH_SECRET
